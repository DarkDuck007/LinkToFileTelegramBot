name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SFTP_PULL_DATA: ${{ secrets.SFTP_PULL_DATA }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          echo "::group::Setting up SSH keys"
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.VPS_SSH_PORT || 22 }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH key configured"
          echo "::endgroup::"

      - name: Pull latest code on VPS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::group::Syncing repository on VPS"
          ssh -T -i ~/.ssh/deploy_key -p ${{ secrets.VPS_SSH_PORT || 22 }} \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "REPO_URL='https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git' DEPLOY_PATH='${{ secrets.DEPLOY_PATH }}' bash -s" << 'PULLEOF'
          set -e
          echo "[pull] Target directory: $DEPLOY_PATH"
          mkdir -p "$DEPLOY_PATH"
          cd "$DEPLOY_PATH"
          if [ ! -d ".git" ]; then
            echo "[pull] Initializing new git repo..."
            git init -b main
            git remote add origin "$REPO_URL"
          else
            echo "[pull] Git repo already exists, updating remote URL..."
            git remote set-url origin "$REPO_URL"
          fi
          echo "[pull] Fetching latest code from origin/main..."
          git fetch origin main
          echo "[pull] Resetting to origin/main..."
          git reset --hard origin/main
          echo "[pull] Current HEAD: $(git log --oneline -1)"
          echo "[pull] Done."
          PULLEOF
          echo "::endgroup::"

      - name: Write .env file on VPS
        run: |
          echo "::group::Writing .env configuration"
          ssh -T -i ~/.ssh/deploy_key -p ${{ secrets.VPS_SSH_PORT || 22 }} \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "DEPLOY_PATH='${{ secrets.DEPLOY_PATH }}' bash -s" << 'ENVEOF'
          set -e
          cat > "$DEPLOY_PATH/.env" << 'EOF'
          TELETHON_API_ID=${{ secrets.TELETHON_API_ID }}
          TELETHON_API_HASH=${{ secrets.TELETHON_API_HASH }}
          TELETHON_BOT_TOKEN=${{ secrets.TELETHON_BOT_TOKEN }}
          TELETHON_PHONE=${{ secrets.TELETHON_PHONE }}
          TELETHON_PASSWORD=${{ secrets.TELETHON_PASSWORD }}
          TELETHON_BOT_USERNAME=${{ secrets.TELETHON_BOT_USERNAME }}
          BOT_API_URL=${{ secrets.BOT_API_URL || 'https://api.telegram.org' }}
          BALE_BOT_TOKEN=${{ secrets.BALE_BOT_TOKEN }}
          BALE_API_URL=${{ secrets.BALE_API_URL || 'https://tapi.bale.ai' }}
          ADMIN_TELEGRAM_IDS=${{ secrets.ADMIN_TELEGRAM_IDS }}
          ADMIN_BALE_IDS=${{ secrets.ADMIN_BALE_IDS }}
          ADMIN_REST_TOKEN=${{ secrets.ADMIN_REST_TOKEN }}
          ADMIN_REST_HOST=0.0.0.0
          ADMIN_REST_PORT=8080
          DOWNLOAD_DIR=/data/downloads
          HASH_DB_PATH=/data/hash_cache.db
          MODERATION_DB_PATH=/data/moderation.db
          TELETHON_SESSION=/data/userbot
          TELETHON_BOT_SESSION=/data/bot
          EOF
          echo "[env] .env written to $DEPLOY_PATH/.env"
          ENVEOF
          echo "::endgroup::"

      - name: SFTP bootstrap (pull session/db files)
        if: env.SFTP_PULL_DATA == 'true'
        run: |
          echo "::group::SFTP data bootstrap"
          ssh -T -i ~/.ssh/deploy_key -p ${{ secrets.VPS_SSH_PORT || 22 }} \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "DEPLOY_PATH='${{ secrets.DEPLOY_PATH }}' bash -s" << 'SFTPEOF'
          set -e

          SFTP_PORT="${{ secrets.SFTP_PORT || 22 }}"
          SFTP_HOST="${{ secrets.SFTP_HOST }}"
          SFTP_USER="${{ secrets.SFTP_USER }}"
          SFTP_PATH="${{ secrets.SFTP_PATH }}"
          STAGING_DIR=$(mktemp -d)

          if ! command -v sshpass &>/dev/null; then
            echo "[sftp] ERROR: sshpass is not installed. Run: sudo apt-get install -y sshpass"
            exit 1
          fi

          echo "[sftp] Ensuring Docker volume exists..."
          docker volume inspect linktofile_bot-data &>/dev/null || docker volume create linktofile_bot-data

          echo "[sftp] Pulling files from ${SFTP_HOST}:${SFTP_PATH} to staging..."
          export SSHPASS='${{ secrets.SFTP_PASSWORD }}'
          sshpass -e scp -P "$SFTP_PORT" -o StrictHostKeyChecking=no \
            "${SFTP_USER}@${SFTP_HOST}:${SFTP_PATH}/*.session" "$STAGING_DIR/" 2>/dev/null || echo "[sftp] No .session files found"
          sshpass -e scp -P "$SFTP_PORT" -o StrictHostKeyChecking=no \
            "${SFTP_USER}@${SFTP_HOST}:${SFTP_PATH}/*.db" "$STAGING_DIR/" 2>/dev/null || echo "[sftp] No .db files found"

          echo "[sftp] Staging dir contents:"
          ls -la "$STAGING_DIR/"

          FILE_COUNT=$(find "$STAGING_DIR" -maxdepth 1 -type f | wc -l)
          if [ "$FILE_COUNT" -gt 0 ]; then
            echo "[sftp] Copying $FILE_COUNT file(s) into Docker volume via container..."
            docker run --rm \
              -v linktofile_bot-data:/data \
              -v "$STAGING_DIR":/src:ro \
              alpine sh -c 'cp /src/* /data/ && chown -R 999:999 /data/ && ls -la /data/'
          else
            echo "[sftp] No files to copy, skipping."
          fi

          rm -rf "$STAGING_DIR"
          echo "[sftp] Bootstrap complete."
          SFTPEOF
          echo "::endgroup::"

      - name: Build and deploy container
        run: |
          echo "::group::Building and starting container"
          ssh -T -i ~/.ssh/deploy_key -p ${{ secrets.VPS_SSH_PORT || 22 }} \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "DEPLOY_PATH='${{ secrets.DEPLOY_PATH }}' bash -s" << 'DEPLOYEOF'
          set -e
          cd "$DEPLOY_PATH"
          echo "[deploy] Working directory: $(pwd)"
          echo "[deploy] Stopping existing containers..."
          docker compose down --timeout 30 || true
          echo "[deploy] Building and starting containers..."
          docker compose up -d --build --remove-orphans
          echo "[deploy] Waiting for container to start..."
          sleep 5
          echo "[deploy] Container status:"
          docker compose ps
          echo "[deploy] Recent logs:"
          docker compose logs --tail=20
          DEPLOYEOF
          echo "::endgroup::"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
